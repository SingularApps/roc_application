<title>IRONMAN Ops App — Project Update · 03/11/2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Montserrat:wght@400;600;700&display=swap">
<style>
  :root { --red:#C8102E; --surface:#FFFFFF; --surface-subtle:#F5F6F6; --ink:#000000; --ink-muted:#4D4D4D; --border:#767A7D; --rule:#E7E8E9; }
  @media (prefers-color-scheme: dark) { :root { --surface:#000000; --surface-subtle:#231F20; --ink:#FFFFFF; --ink-muted:#C4C4C4; --border:#8C8C8C; --rule:#3A3637; } }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--surface); color:var(--ink); font-family:"Montserrat", system-ui, sans-serif; }
  #roc-gate { position:fixed; inset:0; z-index:99999; background:var(--surface); display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto; }
  #roc-gate-form { width:100%; max-width:400px; background:var(--surface-subtle); border-radius:16px; padding:40px 32px 28px; }
  #roc-gate-form .logo { height:30px; width:auto; display:block; margin-bottom:32px; }
  #roc-gate-form .logo-dark { display:none; }
  @media (prefers-color-scheme: dark) { #roc-gate-form .logo-light { display:none; } #roc-gate-form .logo-dark { display:block; } }
  #roc-gate-eyebrow { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--red); margin-bottom:8px; }
  #roc-gate-form h2 { font-family:"Solano Gothic MVB","Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:40px; line-height:40px; letter-spacing:-.02em; text-transform:uppercase; margin-bottom:10px; }
  #roc-gate-form p { font-size:14px; line-height:20px; color:var(--ink-muted); margin-bottom:24px; }
  #roc-gate-form label { display:block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:6px; }
  #roc-gate-input { width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:8px; font:inherit; font-size:16px; padding:12px 14px; margin-bottom:12px; }
  #roc-gate-input:focus { outline:2px solid var(--ink); outline-offset:2px; }
  #roc-gate-err { display:none; font-size:13px; color:var(--red); margin-bottom:12px; }
  #roc-gate-btn { width:100%; background:var(--red); color:#FFFFFF; border:0; border-radius:8px; padding:14px; font:inherit; font-size:14px; font-weight:700; letter-spacing:.04em; cursor:pointer; }
  #roc-gate-btn:hover { background:#B80E2A; }
  #roc-gate-btn:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  #roc-gate-btn:disabled { opacity:.6; cursor:wait; }
  #roc-gate-footer { display:flex; justify-content:space-between; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-muted); }
</style>

    function u8(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
    async function decrypt(pw) {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.data));
      return new TextDecoder().decode(pt);
    }
    function render(html) { document.open(); document.write(html); document.close(); }
    async function tryAuth(pw, silent) {
      var btn = document.getElementById('roc-gate-btn');
      btn.disabled = true;
      try {
        var html = await decrypt(pw);
        try { localStorage.setItem('roc_until', Date.now() + 432e5); localStorage.setItem('roc_key', pw); } catch (e) {}
        render(html);
      } catch (e) {
        btn.disabled = false;
        if (!silent) document.getElementById('roc-gate-err').style.display = 'block';
      }
    }
    var saved = null;
    try { if (+localStorage.getItem('roc_until') > Date.now()) saved = localStorage.getItem('roc_key'); } catch (e) {}
    if (saved) tryAuth(saved, true);
    document.getElementById('roc-gate-btn').addEventListener('click', function () { tryAuth(document.getElementById('roc-gate-input').value); });
    document.getElementById('roc-gate-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryAuth(this.value);
    });
  })();
