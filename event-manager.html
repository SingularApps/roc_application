<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>IRONMAN Ops – Event Manager</title>
<style>
  :root { --red:#CC0000; --black:#0A0A0A; --white:#FFFFFF; --grey-mid:#2A2A2A; --grey-light:#3D3D3D; --grey-text:#9A9A9A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--white); font-family:Arial,sans-serif; }
  #roc-gate { position:fixed; inset:0; z-index:99999; font-family:Arial,sans-serif; background:var(--black); overflow:hidden; }
  #roc-gate-backdrop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #roc-gate-backdrop-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px); background-size:60px 60px; }
  #roc-gate-backdrop-content { position:relative; z-index:1; text-align:center; padding:40px; }
  #roc-gate-backdrop-content .be { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--red); font-weight:700; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:10px; }
  #roc-gate-backdrop-content .be-line { width:28px; height:2px; background:var(--red); }
  #roc-gate-backdrop-content h1 { font-size:clamp(48px,8vw,96px); font-weight:900; line-height:.95; text-transform:uppercase; letter-spacing:-3px; color:var(--white); margin:0 0 12px; }
  #roc-gate-backdrop-content h1 span { color:var(--red); }
  #roc-gate-backdrop-content p { font-size:15px; color:var(--grey-text); letter-spacing:1px; }
  #roc-gate-blur { position:absolute; inset:0; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); background:rgba(10,10,10,.6); z-index:2; }
  #roc-gate-modal { position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; padding:24px; }
  #roc-gate-form { width:100%; max-width:400px; background:#111; border:1px solid #222; border-top:3px solid var(--red); padding:40px 36px 32px; }
  #roc-gate-eyebrow { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  #roc-gate-eyebrow .line { width:32px; height:2px; background:var(--red); }
  #roc-gate-eyebrow span { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--red); font-weight:700; }
  #roc-gate-form h2 { font-size:28px; font-weight:900; text-transform:uppercase; letter-spacing:-.5px; line-height:1; margin:0 0 8px; color:var(--white); }
  #roc-gate-form p { font-size:13px; color:var(--grey-text); line-height:1.6; margin:0 0 28px; }
  #roc-gate-pw-wrap { background:var(--grey-mid); border:1px solid var(--grey-light); margin-bottom:16px; transition:border-color .2s; }
  #roc-gate-pw-wrap:focus-within { border-color:var(--red); }
  #roc-gate-input { width:100%; background:transparent; border:none; outline:none; color:var(--white); font-size:15px; padding:14px 16px; font-family:Arial,sans-serif; letter-spacing:2px; }
  #roc-gate-input::placeholder { color:#555; letter-spacing:2px; text-transform:uppercase; font-size:11px; font-weight:700; }
  #roc-gate-err { font-size:12px; color:var(--red); display:none; margin-bottom:8px; }
  #roc-gate-btn { width:100%; background:var(--red); color:var(--white); border:none; padding:14px; font-size:11px; letter-spacing:3px; text-transform:uppercase; font-weight:700; cursor:pointer; transition:background .2s; font-family:Arial,sans-serif; }
  #roc-gate-btn:hover { background:#E60000; }
  #roc-gate-btn:disabled { opacity:.6; cursor:wait; }
  #roc-gate-footer { display:flex; justify-content:space-between; margin-top:24px; padding-top:16px; border-top:1px solid #222; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#555; }
  #roc-gate-footer .dot { width:6px; height:6px; border-radius:50%; background:var(--red); display:inline-block; margin-right:8px; animation:rg-pulse 2s infinite; }
  @keyframes rg-pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
</style>
</head>
<body>
<div id="roc-gate">
  <div id="roc-gate-backdrop">
    <div id="roc-gate-backdrop-grid"></div>
    <div id="roc-gate-backdrop-content">
      <div class="be"><div class="be-line"></div>Restricted Access</div>
      <h1>IRONMAN<br><span>OPS APP</span></h1>
      <p>Event Manager — Confidential</p>
    </div>
  </div>
  <div id="roc-gate-blur"></div>
  <div id="roc-gate-modal">

      <div id="roc-gate-eyebrow"><div class="line"></div><span>Authentication Required</span></div>
      <h2>Event Manager</h2>

      <div id="roc-gate-pw-wrap">
        <input type="password" id="roc-gate-input" placeholder="Access Key" autofocus />

      <span id="roc-gate-err">Incorrect password.</span>
      <button id="roc-gate-btn">Access</button>
      <div id="roc-gate-footer"><span><span class="dot"></span>Encrypted</span><span>IRN — RaceOps</span></div>
    </div>
  </div>
</div>

    function u8(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
    async function decrypt(pw) {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.data));
      return new TextDecoder().decode(pt);
    }
    function render(html) { document.open(); document.write(html); document.close(); }
    async function tryAuth(pw, silent) {
      var btn = document.getElementById('roc-gate-btn');
      btn.disabled = true;
      try {
        var html = await decrypt(pw);
        try { localStorage.setItem('roc_until', Date.now() + 432e5); localStorage.setItem('roc_key', pw); } catch (e) {}
        render(html);
      } catch (e) {
        btn.disabled = false;
        if (!silent) document.getElementById('roc-gate-err').style.display = 'block';
      }
    }
    var saved = null;
    try { if (+localStorage.getItem('roc_until') > Date.now()) saved = localStorage.getItem('roc_key'); } catch (e) {}
    if (saved) tryAuth(saved, true);
    document.getElementById('roc-gate-btn').addEventListener('click', function () { tryAuth(document.getElementById('roc-gate-input').value); });
    document.getElementById('roc-gate-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryAuth(this.value);
    });
  })();
